<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mongoflix - Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <i class="fas fa-film"></i>
          <h1>Mongoflix Admin</h1>
        </div>
        <nav class="nav">
          <a class="nav-btn" href="/">Accueil</a>
          <a class="nav-btn" href="/admin">Admin</a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <div class="section-header">
          <h2><i class="fas fa-chart-line"></i> Statistiques</h2>
        </div>
        <div class="charts-grid">
          <div class="chart-card">
            <h3>Top 5 des contenus les plus regardés</h3>
            <canvas id="chart-genre"></canvas>
          </div>
          <div class="chart-card">
            <h3>Temps total de visionnage par utilisateur</h3>
            <canvas id="chart-top-movies"></canvas>
          </div>
          <div class="chart-card">
            <h3>Moyenne d'âge des utilisateurs</h3>
            <canvas id="chart-directors"></canvas>
          </div>
          <div class="chart-card">
            <h3>Répartitions des vues par pays</h3>
            <canvas id="chart-directors"></canvas>
          </div>
          <div class="chart-card">
            <h3>Répartitions par type d'appareil</h3>
            <canvas id="chart-directors"></canvas>
          </div>
          <div class="chart-card">
            <h3>Genre les plus regardés</h3>
            <canvas id="chart-directors"></canvas>
          </div>
        </div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
